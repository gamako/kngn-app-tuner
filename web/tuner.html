<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Chromatic Tuner</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #121418;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas {
      display: block;
      background: #121418;
      outline: none;
      image-rendering: pixelated;
      cursor: default;
    }
    #kngn-error {
      display: none;
      color: #f0f2f7;
      font: 16px system-ui, sans-serif;
      padding: 24px;
    }
  </style>
</head>
<body data-wasm="tuner.wasm"
      data-audio-transport="worklet_shared"
      data-capture="true"
      data-shared="1">
  <canvas id="kngn-canvas" tabindex="0"></canvas>
  <div id="kngn-error"></div>

  <!--
    Microphone capture goes through kngn's shared-memory AudioWorklet capture path
    (ADR-027 in the kngn repository): kngn.js reads data-capture and wires
    getUserMedia, the AudioWorkletNode input and the capture ring itself. This page
    needs no capture-specific script of its own, and requires COOP/COEP (see
    scripts/serve-web.py / web/deploy/serve-coop-coep.py).
  -->

  <!-- kngn.js supplies the browser frame driver. -->
  <!-- kngn:inline-module -->
  <script type="module" src="./kngn.js"></script>
</body>
</html>
